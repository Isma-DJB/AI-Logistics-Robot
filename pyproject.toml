[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-logistics-robot"
version = "0.1.0.dev0"
description = "Modular autonomous logistics robot developed through simulation and physical integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ismail Djebli" },
]
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
simulation = [
    "pygame>=2.6,<3",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
ai-logistics-robot = "ai_logistics_robot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ai_logistics_robot"]
mypy_path = "src"
